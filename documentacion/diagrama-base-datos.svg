<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="2080" viewBox="0 0 1520 2080" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Blue Fragancias: las 11 tablas y sus 16 claves foráneas</title>
<desc id="diagram-desc">Diagrama de catálogo, pedidos, pagos e inventario. Un panel inferior muestra las seis referencias a administradores. Las flechas van de la tabla referenciada a la que guarda la clave foránea. Las etiquetas indican cardinalidad y campos.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#69839f" stroke-width="1.3"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183149}.node-title{font-family:Consolas,monospace;font-size:19px;font-weight:700}.summary{font-size:17px}.field{font-family:Consolas,monospace;font-size:14px}.edge path{fill:none;stroke:#69839f;stroke-width:2;marker-end:url(#arrow)}.edge-label text{font-family:Consolas,monospace;font-size:14px}.admin-edge path{stroke:#9584ae}.node,.edge,.reference{transition:opacity .15s}.node:hover .card-bg{stroke:#245bb0;stroke-width:2}.dim{opacity:.16}.selected .card-bg{stroke:#245bb0;stroke-width:3}.related .card-bg{stroke:#69839f;stroke-width:2}</style>
<rect width="1520" height="2080" fill="#f4f7fb"/>
<text x="40" y="51" font-size="30" font-weight="700">Blue Fragancias · mapa de la base de datos</text>
<text x="40" y="83" font-size="18">11 tablas · 16 claves foráneas · Esquema inicial de PostgreSQL</text>
<text x="40" y="124" font-size="16" fill="#14766f">CATÁLOGO</text>
<text x="1090" y="124" font-size="16" fill="#245bb0">VENTA Y SEGUIMIENTO</text>
<g class="edge" data-parent="marcas" data-child="productos"><path d="M185 310 V390"/><g class="edge-label"><rect x="141.6" y="320" width="86.8" height="54" rx="4" fill="#f4f7fb"/><text x="185" y="337" text-anchor="middle" fill="#38536e">marca_id</text><text x="185" y="360" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="productos" data-child="variantes_producto"><path d="M330 455 H470"/><g class="edge-label"><rect x="344.45" y="397" width="111.1" height="54" rx="4" fill="#f4f7fb"/><text x="400" y="414" text-anchor="middle" fill="#38536e">producto_id</text><text x="400" y="437" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="productos" data-child="imagenes_producto"><path d="M185 580 V775"/><g class="edge-label"><rect x="129.45" y="642" width="111.1" height="54" rx="4" fill="#f4f7fb"/><text x="185" y="659" text-anchor="middle" fill="#38536e">producto_id</text><text x="185" y="682" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="variantes_producto" data-child="detalle_pedidos"><path d="M640 610 V775"/><g class="edge-label"><rect x="584.45" y="651" width="111.1" height="54" rx="4" fill="#f4f7fb"/><text x="640" y="668" text-anchor="middle" fill="#38536e">variante_id</text><text x="640" y="691" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="tasas_cambio" data-child="pedidos"><path d="M1255 325 V425"/><g class="edge-label"><rect x="1187.3" y="336" width="135.39999999999998" height="77" rx="4" fill="#f4f7fb"/><text x="1255" y="353" text-anchor="middle" fill="#38536e">tasa_cambio_id</text><text x="1255" y="376" text-anchor="middle" fill="#38536e">+ tasa_eur_ves</text><text x="1255" y="399" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="pedidos" data-child="detalle_pedidos"><path d="M1090 540 H940 V885 H810"/><g class="edge-label"><rect x="892.55" y="691" width="94.89999999999999" height="54" rx="4" fill="#f4f7fb"/><text x="940" y="708" text-anchor="middle" fill="#38536e">pedido_id</text><text x="940" y="731" text-anchor="middle" fill="#38536e">1 → 1..N*</text></g></g><g class="edge" data-parent="pedidos" data-child="pagos"><path d="M1255 655 V815"/><g class="edge-label"><rect x="1207.55" y="702" width="94.89999999999999" height="54" rx="4" fill="#f4f7fb"/><text x="1255" y="719" text-anchor="middle" fill="#38536e">pedido_id</text><text x="1255" y="742" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="pedidos" data-child="historial_pedidos"><path d="M1420 540 H1480 V1120 H1340 V1160"/><g class="edge-label"><rect x="1272.55" y="1065" width="94.89999999999999" height="54" rx="4" fill="#f4f7fb"/><text x="1320" y="1082" text-anchor="middle" fill="#38536e">pedido_id</text><text x="1320" y="1105" text-anchor="middle" fill="#38536e">1 → 1..N*</text></g></g><g class="edge" data-parent="variantes_producto" data-child="movimientos_inventario"><path d="M470 530 H385 V1270 H470"/><g class="edge-label"><rect x="329.45" y="1063" width="111.1" height="54" rx="4" fill="#f4f7fb"/><text x="385" y="1080" text-anchor="middle" fill="#38536e">variante_id</text><text x="385" y="1103" text-anchor="middle" fill="#38536e">1 → 0..N</text></g></g><g class="edge" data-parent="detalle_pedidos" data-child="movimientos_inventario"><path d="M650 995 V1160"/><g class="edge-label"><rect x="545.85" y="1041" width="208.29999999999998" height="54" rx="4" fill="#f4f7fb"/><text x="650" y="1058" text-anchor="middle" fill="#38536e">pedido_id + variante_id</text><text x="650" y="1081" text-anchor="middle" fill="#38536e">0..1 → 0..N</text></g></g>
<a href="diagrama-base-datos.html#marcas" data-table="marcas" aria-label="Ver marcas">
  <g class="node" id="n-marcas"><title>marcas: Agrupa los perfumes por fabricante o marca.</title>
  <rect class="card-bg" x="40" y="150" width="290" height="160" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="40" y="150" width="5" height="160" rx="2" fill="#14766f"/>
  <text class="node-title" x="60" y="182" fill="#14766f">marcas</text>
  <text class="summary" x="60" y="209">Agrupa los perfumes</text><text class="summary" x="60" y="230">por fabricante o marca.</text>
  <line x1="60" y1="244" x2="310" y2="244" stroke="#e1e8f0"/>
  <text class="field" x="60" y="270">PK  id</text><text class="field" x="60" y="295">nombre</text>
  </g></a><a href="diagrama-base-datos.html#productos" data-table="productos" aria-label="Ver productos">
  <g class="node" id="n-productos"><title>productos: Describe el perfume que ve el cliente.</title>
  <rect class="card-bg" x="40" y="390" width="290" height="190" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="40" y="390" width="5" height="190" rx="2" fill="#14766f"/>
  <text class="node-title" x="60" y="422" fill="#14766f">productos</text>
  <text class="summary" x="60" y="449">Describe el perfume</text><text class="summary" x="60" y="470">que ve el cliente.</text>
  <line x1="60" y1="484" x2="310" y2="484" stroke="#e1e8f0"/>
  <text class="field" x="60" y="510">PK  id</text><text class="field" x="60" y="535">FK  marca_id</text><text class="field" x="60" y="560">nombre · slug · activo</text>
  </g></a><a href="diagrama-base-datos.html#variantes_producto" data-table="variantes_producto" aria-label="Ver variantes_producto">
  <g class="node" id="n-variantes_producto"><title>variantes_producto: Presentación vendible: precio, volumen y existencias.</title>
  <rect class="card-bg" x="470" y="390" width="340" height="220" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="470" y="390" width="5" height="220" rx="2" fill="#14766f"/>
  <text class="node-title" x="490" y="422" fill="#14766f">variantes_producto</text>
  <text class="summary" x="490" y="449">Presentación vendible:</text><text class="summary" x="490" y="470">precio, volumen y existencias.</text>
  <line x1="490" y1="484" x2="790" y2="484" stroke="#e1e8f0"/>
  <text class="field" x="490" y="510">PK  id</text><text class="field" x="490" y="535">FK  producto_id</text><text class="field" x="490" y="560">sku · precio_ref_usd</text><text class="field" x="490" y="585">stock_fisico · stock_reservado</text>
  </g></a><a href="diagrama-base-datos.html#imagenes_producto" data-table="imagenes_producto" aria-label="Ver imagenes_producto">
  <g class="node" id="n-imagenes_producto"><title>imagenes_producto: Guarda la ubicación y el orden de las fotografías.</title>
  <rect class="card-bg" x="40" y="775" width="290" height="190" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="40" y="775" width="5" height="190" rx="2" fill="#14766f"/>
  <text class="node-title" x="60" y="807" fill="#14766f">imagenes_producto</text>
  <text class="summary" x="60" y="834">Guarda la ubicación y</text><text class="summary" x="60" y="855">el orden de las fotografías.</text>
  <line x1="60" y1="869" x2="310" y2="869" stroke="#e1e8f0"/>
  <text class="field" x="60" y="895">PK  id</text><text class="field" x="60" y="920">FK  producto_id</text><text class="field" x="60" y="945">clave_archivo · orden</text>
  </g></a><a href="diagrama-base-datos.html#tasas_cambio" data-table="tasas_cambio" aria-label="Ver tasas_cambio">
  <g class="node" id="n-tasas_cambio"><title>tasas_cambio: Historial del euro en Bs, fuente y fecha de vigencia.</title>
  <rect class="card-bg" x="1090" y="150" width="330" height="175" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="1090" y="150" width="5" height="175" rx="2" fill="#245bb0"/>
  <text class="node-title" x="1110" y="182" fill="#245bb0">tasas_cambio</text>
  <text class="summary" x="1110" y="209">Historial del euro en Bs,</text><text class="summary" x="1110" y="230">fuente y fecha de vigencia.</text>
  <line x1="1110" y1="244" x2="1400" y2="244" stroke="#e1e8f0"/>
  <text class="field" x="1110" y="270">PK  id</text><text class="field" x="1110" y="295">tasa_eur_ves · fecha_vigencia</text>
  </g></a><a href="diagrama-base-datos.html#pedidos" data-table="pedidos" aria-label="Ver pedidos">
  <g class="node" id="n-pedidos"><title>pedidos: Cabecera de la compra: cliente, entrega y totales.</title>
  <rect class="card-bg" x="1090" y="425" width="330" height="230" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="1090" y="425" width="5" height="230" rx="2" fill="#245bb0"/>
  <text class="node-title" x="1110" y="457" fill="#245bb0">pedidos</text>
  <text class="summary" x="1110" y="484">Cabecera de la compra:</text><text class="summary" x="1110" y="505">cliente, entrega y totales.</text>
  <line x1="1110" y1="519" x2="1400" y2="519" stroke="#e1e8f0"/>
  <text class="field" x="1110" y="545">PK  id</text><text class="field" x="1110" y="570">FK  tasa_cambio_id + tasa_eur_ves</text><text class="field" x="1110" y="595">nombre_cliente · estado</text><text class="field" x="1110" y="620">total_ref_usd · total_ves</text>
  </g></a><a href="diagrama-base-datos.html#detalle_pedidos" data-table="detalle_pedidos" aria-label="Ver detalle_pedidos">
  <g class="node" id="n-detalle_pedidos"><title>detalle_pedidos: Una fila por presentación incluida en el pedido.</title>
  <rect class="card-bg" x="470" y="775" width="340" height="220" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="470" y="775" width="5" height="220" rx="2" fill="#245bb0"/>
  <text class="node-title" x="490" y="807" fill="#245bb0">detalle_pedidos</text>
  <text class="summary" x="490" y="834">Una fila por presentación</text><text class="summary" x="490" y="855">incluida en el pedido.</text>
  <line x1="490" y1="869" x2="790" y2="869" stroke="#e1e8f0"/>
  <text class="field" x="490" y="895">PK  id</text><text class="field" x="490" y="920">FK  pedido_id · variante_id</text><text class="field" x="490" y="945">cantidad · precio_unitario_ref_usd</text><text class="field" x="490" y="970">UQ  pedido_id + variante_id</text>
  </g></a><a href="diagrama-base-datos.html#pagos" data-table="pagos" aria-label="Ver pagos">
  <g class="node" id="n-pagos"><title>pagos: Registra dinero reportado y su revisión administrativa.</title>
  <rect class="card-bg" x="1090" y="815" width="330" height="210" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="1090" y="815" width="5" height="210" rx="2" fill="#245bb0"/>
  <text class="node-title" x="1110" y="847" fill="#245bb0">pagos</text>
  <text class="summary" x="1110" y="874">Registra dinero reportado</text><text class="summary" x="1110" y="895">y su revisión administrativa.</text>
  <line x1="1110" y1="909" x2="1400" y2="909" stroke="#e1e8f0"/>
  <text class="field" x="1110" y="935">PK  id</text><text class="field" x="1110" y="960">FK  pedido_id</text><text class="field" x="1110" y="985">metodo · moneda · monto</text><text class="field" x="1110" y="1010">estado · referencia_operacion</text>
  </g></a><a href="diagrama-base-datos.html#movimientos_inventario" data-table="movimientos_inventario" aria-label="Ver movimientos_inventario">
  <g class="node" id="n-movimientos_inventario"><title>movimientos_inventario: Libro de entradas, reservas, ventas y devoluciones.</title>
  <rect class="card-bg" x="470" y="1160" width="370" height="225" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="470" y="1160" width="5" height="225" rx="2" fill="#995600"/>
  <text class="node-title" x="490" y="1192" fill="#995600">movimientos_inventario</text>
  <text class="summary" x="490" y="1219">Libro de entradas, reservas,</text><text class="summary" x="490" y="1240">ventas y devoluciones.</text>
  <line x1="490" y1="1254" x2="820" y2="1254" stroke="#e1e8f0"/>
  <text class="field" x="490" y="1280">PK  id</text><text class="field" x="490" y="1305">FK  variante_id</text><text class="field" x="490" y="1330">FK  pedido_id + variante_id</text><text class="field" x="490" y="1355">cambio_fisico · cambio_reservado</text>
  </g></a><a href="diagrama-base-datos.html#historial_pedidos" data-table="historial_pedidos" aria-label="Ver historial_pedidos">
  <g class="node" id="n-historial_pedidos"><title>historial_pedidos: Conserva la creación y los cambios de estado.</title>
  <rect class="card-bg" x="1090" y="1160" width="330" height="195" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="1090" y="1160" width="5" height="195" rx="2" fill="#66518d"/>
  <text class="node-title" x="1110" y="1192" fill="#66518d">historial_pedidos</text>
  <text class="summary" x="1110" y="1219">Conserva la creación y</text><text class="summary" x="1110" y="1240">los cambios de estado.</text>
  <line x1="1110" y1="1254" x2="1400" y2="1254" stroke="#e1e8f0"/>
  <text class="field" x="1110" y="1280">PK  id</text><text class="field" x="1110" y="1305">FK  pedido_id</text><text class="field" x="1110" y="1330">estado_anterior · estado_nuevo</text>
  </g></a>
<text x="40" y="1442" font-size="16">Flecha: tabla referenciada → tabla que guarda la FK.  1 = uno · 0..1 = opcional · 0..N = ninguno o muchos.</text>
<text x="40" y="1469" font-size="16">* Un pedido tiene al menos una línea al COMMIT; el trigger también crea su primer evento de historial.</text>
<line x1="40" y1="1500" x2="1480" y2="1500" stroke="#cbd8e5"/>
<text x="40" y="1540" font-size="22" font-weight="700">Administración y trazabilidad</text>
<text x="40" y="1570" font-size="16">Un administrador → 0..N registros.</text>
<text x="40" y="1597" font-size="16">Cada referencia admite 0..1 administrador,</text>
<text x="40" y="1620" font-size="16">con condiciones según la operación.</text>
<g class="edge admin-edge" data-parent="administradores" data-child="tasas_cambio"><path d="M390 1720 H460 V1565 H555"/></g><g class="edge admin-edge" data-parent="administradores" data-child="pedidos"><path d="M390 1720 H460 V1643 H555"/></g><g class="edge admin-edge" data-parent="administradores" data-child="pagos"><path d="M390 1720 H460 V1721 H555"/></g><g class="edge admin-edge" data-parent="administradores" data-child="pagos"><path d="M390 1720 H460 V1799 H555"/></g><g class="edge admin-edge" data-parent="administradores" data-child="movimientos_inventario"><path d="M390 1720 H460 V1877 H555"/></g><g class="edge admin-edge" data-parent="administradores" data-child="historial_pedidos"><path d="M390 1720 H460 V1955 H555"/></g><a href="diagrama-base-datos.html#administradores" data-table="administradores" aria-label="Ver administradores">
  <g class="node" id="n-administradores"><title>administradores: Personal que administra y revisa las operaciones.</title>
  <rect class="card-bg" x="40" y="1630" width="350" height="205" rx="12" fill="#ffffff" stroke="#cbd8e5"/>
  <rect x="40" y="1630" width="5" height="205" rx="2" fill="#66518d"/>
  <text class="node-title" x="60" y="1662" fill="#66518d">administradores</text>
  <text class="summary" x="60" y="1689">Personal que administra</text><text class="summary" x="60" y="1710">y revisa las operaciones.</text>
  <line x1="60" y1="1724" x2="370" y2="1724" stroke="#e1e8f0"/>
  <text class="field" x="60" y="1750">PK  id</text><text class="field" x="60" y="1775">email · hash_password</text><text class="field" x="60" y="1800">activo</text>
  </g></a><a href="diagrama-base-datos.html#tasas_cambio" data-table="tasas_cambio"><g class="reference" data-ref="tasas_cambio"><rect x="555" y="1535" width="865" height="66" rx="8" fill="#ffffff" stroke="#ddd7e8"/>
  <text x="575" y="1560" class="field" fill="#66518d">tasas_cambio.registrada_por</text><text x="575" y="1584" class="summary">Obligatorio si la tasa es manual.</text></g></a><a href="diagrama-base-datos.html#pedidos" data-table="pedidos"><g class="reference" data-ref="pedidos"><rect x="555" y="1613" width="865" height="66" rx="8" fill="#ffffff" stroke="#ddd7e8"/>
  <text x="575" y="1638" class="field" fill="#66518d">pedidos.actualizado_por</text><text x="575" y="1662" class="summary">Puede estar vacío en pedidos de invitados.</text></g></a><a href="diagrama-base-datos.html#pagos" data-table="pagos"><g class="reference" data-ref="pagos"><rect x="555" y="1691" width="865" height="66" rx="8" fill="#ffffff" stroke="#ddd7e8"/>
  <text x="575" y="1716" class="field" fill="#66518d">pagos.registrado_por</text><text x="575" y="1740" class="summary">Quién ingresó el pago, si corresponde.</text></g></a><a href="diagrama-base-datos.html#pagos" data-table="pagos"><g class="reference" data-ref="pagos"><rect x="555" y="1769" width="865" height="66" rx="8" fill="#ffffff" stroke="#ddd7e8"/>
  <text x="575" y="1794" class="field" fill="#66518d">pagos.revisado_por</text><text x="575" y="1818" class="summary">Obligatorio al verificar o rechazar.</text></g></a><a href="diagrama-base-datos.html#movimientos_inventario" data-table="movimientos_inventario"><g class="reference" data-ref="movimientos_inventario"><rect x="555" y="1847" width="865" height="66" rx="8" fill="#ffffff" stroke="#ddd7e8"/>
  <text x="575" y="1872" class="field" fill="#66518d">movimientos_inventario.administrador_id</text><text x="575" y="1896" class="summary">Obligatorio en entrada, ajuste o devolución.</text></g></a><a href="diagrama-base-datos.html#historial_pedidos" data-table="historial_pedidos"><g class="reference" data-ref="historial_pedidos"><rect x="555" y="1925" width="865" height="66" rx="8" fill="#ffffff" stroke="#ddd7e8"/>
  <text x="575" y="1950" class="field" fill="#66518d">historial_pedidos.administrador_id</text><text x="575" y="1974" class="summary">Se copia del pedido cuando existe.</text></g></a>
<text x="40" y="1910" font-size="17" font-weight="600">PK: identifica una fila.</text>
<text x="40" y="1940" font-size="17" font-weight="600">FK: enlaza con otra tabla.</text>
<text x="40" y="1970" font-size="17" font-weight="600">UQ: impide duplicados.</text>
<text x="555" y="2041" font-size="16">Las filas de este panel son referencias a las tablas de arriba, no tablas adicionales.</text>
</svg>